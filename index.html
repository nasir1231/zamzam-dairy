<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZamZam Fresh Dairy Products</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      min-height: 100vh;
      background: #f0f7f0;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1a5c2a;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    .header .amp { font-size: 20px; margin: 6px 0; opacity: 0.9; }
    .header h2 { font-size: 20px; font-weight: 400; letter-spacing: 2px; }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-box {
      background: white;
      border-radius: 12px;
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .login-box h3 {
      text-align: center;
      color: #1a5c2a;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #1a5c2a;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #1a5c2a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }

    .btn-login:hover { background: #144d22; }
    .btn-login:disabled { background: #aaa; cursor: not-allowed; }

    .error-msg {
      background: #ffe8e8;
      color: #c0392b;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }

    .footer {
      background: #1a5c2a;
      color: white;
      text-align: center;
      padding: 15px 20px;
      font-size: 13px;
    }
    .footer a { color: #a8d5b5; text-decoration: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ZamZam Fresh Dairy Products</h1>
    <div class="amp">&amp;</div>
    <h2>subzi.pk</h2>
  </div>

  <div class="login-wrapper">
    <div class="login-box">
      <h3>🔐 Login</h3>
      <p>Enter your credentials to access the system</p>

      <div class="error-msg" id="errorMsg"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">Login</button>
    </div>
  </div>

  <div class="footer">
    📞 0300-4455771 &nbsp;|&nbsp; ✉️ admin@subzi.pk &nbsp;|&nbsp; 🌐 <a href="https://subzi.pk">subzi.pk</a>
  </div>

  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      if (!email || !password) {
        errorMsg.textContent = 'Please enter both email and password.';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Invalid email or password. Please try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }

      window.location.href = 'dashboard.html';
    }

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    window.addEventListener('load', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
