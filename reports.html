<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — ZamZam Dairy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f7f0; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #1a5c2a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { text-align: center; flex: 1; }
    .header-title h1 { font-size: 18px; font-weight: 700; }
    .header-title p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .btn-back { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
    .date-bar { background: #e8f5e9; padding: 10px 20px; text-align: center; font-size: 14px; color: #1a5c2a; font-weight: 600; border-bottom: 1px solid #c8e6c9; }
    .main { flex: 1; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 700; color: #1a5c2a; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #e8f5e9; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: #1a5c2a; }
    .btn-report { width: 100%; padding: 13px; background: #1a5c2a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .btn-report:hover { background: #144d22; }
    .btn-report:disabled { background: #aaa; cursor: not-allowed; }
    .customer-bill-item { border: 1px solid #e8f5e9; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .customer-bill-item .cname { font-weight: 600; color: #1a5c2a; font-size: 14px; }
    .customer-bill-item .cbalance { color: #c0392b; font-weight: 700; font-size: 14px; }
    .btn-bill { padding: 6px 12px; background: #1a5c2a; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-bill:hover { background: #144d22; }
    .btn-all-bills { width: 100%; padding: 12px; background: #e8f5e9; color: #1a5c2a; border: 2px solid #1a5c2a; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-all-bills:hover { background: #d0ebd0; }
    .footer { background: #1a5c2a; color: white; text-align: center; padding: 12px 20px; font-size: 12px; }
    .footer a { color: #a8d5b5; text-decoration: none; }
  </style>
</head>
<body>

  <div class="header">
    <a href="dashboard.html" class="btn-back">← Back</a>
    <div class="header-title">
      <h1>📊 Reports</h1>
      <p>Daily &amp; Monthly PDF Reports</p>
    </div>
    <div style="width:70px"></div>
  </div>

  <div class="date-bar" id="dateBar">Loading...</div>

  <div class="main">

    <div class="card">
      <div class="card-title">📅 Daily Report</div>
      <div class="form-group">
        <label>Select Date</label>
        <input type="date" id="reportDate" />
      </div>
      <div id="dailySummary" style="margin-bottom:15px;"></div>
      <button class="btn-report" onclick="generateDailyReport()">📄 Generate &amp; Download Daily PDF</button>
    </div>

    <div class="card">
      <div class="card-title">🧾 Monthly Customer Bills</div>
      <div class="form-group">
        <label>Select Month &amp; Year</label>
        <input type="month" id="billMonth" />
      </div>
      <button class="btn-report" onclick="loadCustomerBills()">🔍 Load Customer Bills</button>
      <div id="customerBillsList" style="margin-top:15px;"></div>
    </div>

  </div>

  <div class="footer">
    📞 0300-4455771 &nbsp;|&nbsp; ✉️ admin@subzi.pk &nbsp;|&nbsp; 🌐 <a href="https://subzi.pk">subzi.pk</a>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    window.addEventListener('load', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateBar').textContent = '📅 ' + now.toLocaleDateString('en-PK', options);

      document.getElementById('reportDate').value = now.toISOString().split('T')[0];
      document.getElementById('billMonth').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    });

    async function generateDailyReport() {
      const date = document.getElementById('reportDate').value;
      if (!date) { alert('Please select a date.'); return; }

      const d = new Date(date);
      const month = d.getMonth() + 1;
      const year = d.getFullYear();

      const [walkin, delivery, expenses, sessions, yogurt, purchases] = await Promise.all([
        supabaseClient.from('walkin_sales').select('*').eq('sale_date', date),
        supabaseClient.from('deliveries').select('*, customers(name)').eq('delivery_date', date),
        supabaseClient.from('expenses').select('*').eq('expense_date', date),
        supabaseClient.from('stock_sessions').select('*').eq('session_date', date).order('created_at'),
        supabaseClient.from('yogurt_production').select('*').eq('production_date', date),
        supabaseClient.from('purchases').select('*, suppliers(name)').eq('purchase_date', date)
      ]);

      const walkinTotal = walkin.data?.reduce((s, r) => s + (r.total_amount || 0), 0) || 0;
      const walkinMilk = walkin.data?.reduce((s, r) => s + (r.milk_kg || 0), 0) || 0;
      const walkinYogurt = walkin.data?.reduce((s, r) => s + (r.yogurt_kg || 0), 0) || 0;
      const deliveryTotal = delivery.data?.reduce((s, r) => s + (r.total_amount || 0), 0) || 0;
      const deliveryMilk = delivery.data?.reduce((s, r) => s + (r.milk_kg || 0), 0) || 0;
      const expensesTotal = expenses.data?.reduce((s, r) => s + (r.amount || 0), 0) || 0;
      const totalSales = walkinTotal + deliveryTotal;
      const profit = totalSales - expensesTotal;
      const milkPurchased = purchases.data?.reduce((s, r) => s + (r.quantity_kg || 0), 0) || 0;
      const milkUsedYogurt = yogurt.data?.reduce((s, r) => s + (r.milk_used_kg || 0), 0) || 0;
      const yogurtProduced = yogurt.data?.reduce((s, r) => s + (r.yogurt_produced_kg || 0), 0) || 0;

      const doc = new jsPDF();
      const pageW = doc.internal.pageSize.getWidth();

      doc.setFillColor(26, 92, 42);
      doc.rect(0, 0, pageW, 45, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.text('ZamZam Fresh Dairy Products', pageW / 2, 15, { align: 'center' });
      doc.setFontSize(13);
      doc.setFont('helvetica', 'normal');
      doc.text('&', pageW / 2, 23, { align: 'center' });
      doc.setFontSize(14);
      doc.text('subzi.pk', pageW / 2, 31, { align: 'center' });
      doc.setFontSize(10);
      doc.text('Daily Report', pageW / 2, 40, { align: 'center' });

      doc.setTextColor(0, 0, 0);
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text('Date: ' + d.toLocaleDateString('en-PK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }), 14, 55);

      let y = 65;

      const section = (title) => {
        doc.setFillColor(232, 245, 233);
        doc.rect(14, y - 5, pageW - 28, 8, 'F');
        doc.setTextColor(26, 92, 42);
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.text(title, 16, y);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');
        y += 10;
      };

      const row = (label, value, bold = false) => {
        doc.setFontSize(10);
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.text(label, 18, y);
        doc.text(value, pageW - 14, y, { align: 'right' });
        doc.setDrawColor(220, 220, 220);
        doc.line(14, y + 2, pageW - 14, y + 2);
        y += 10;
      };

      section('STOCK SUMMARY');
      if (sessions.data && sessions.data.length > 0) {
        const morning = sessions.data.find(s => s.session_type === 'morning');
        if (morning) row('Opening Stock (Milk)', morning.opening_milk_kg + ' kg');
        if (morning) row('Opening Stock (Yogurt)', morning.opening_yogurt_kg + ' kg');
      }
      row('Total Milk Purchased', milkPurchased.toFixed(2) + ' kg');
      row('Milk Used for Yogurt', milkUsedYogurt.toFixed(2) + ' kg');
      row('Yogurt Produced', yogurtProduced.toFixed(2) + ' kg');
      y += 3;

      section('SALES');
      row('Walk-in Milk', walkinMilk.toFixed(2) + ' kg');
      row('Walk-in Yogurt', walkinYogurt.toFixed(2) + ' kg');
      row('Walk-in Sales Total', 'Rs ' + walkinTotal.toLocaleString());
      row('Delivery Milk', deliveryMilk.toFixed(2) + ' kg');
      row('Delivery Sales Total', 'Rs ' + deliveryTotal.toLocaleString());
      row('TOTAL SALES', 'Rs ' + totalSales.toLocaleString(), true);
      y += 3;

      section('EXPENSES');
      if (expenses.data && expenses.data.length > 0) {
        expenses.data.forEach(e => {
          row(e.category.charAt(0).toUpperCase() + e.category.slice(1) + (e.description ? ' - ' + e.description : ''), 'Rs ' + e.amount.toLocaleString());
        });
      } else {
        doc.setFontSize(10);
        doc.text('No expenses recorded', 18, y);
        y += 10;
      }
      row('TOTAL EXPENSES', 'Rs ' + expensesTotal.toLocaleString(), true);
      y += 5;

      doc.setFillColor(profit >= 0 ? 26 : 192, profit >= 0 ? 92 : 57, profit >= 0 ? 42 : 43);
      doc.rect(14, y - 5, pageW - 28, 12, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.text(profit >= 0 ? 'NET PROFIT' : 'NET LOSS', 18, y + 3);
      doc.text('Rs ' + Math.abs(profit).toLocaleString(), pageW - 14, y + 3, { align: 'right' });
      y += 20;

      const pageH = doc.internal.pageSize.getHeight();
      doc.setFillColor(26, 92, 42);
      doc.rect(0, pageH - 20, pageW, 20, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('0300-4455771  |  admin@subzi.pk  |  subzi.pk', pageW / 2, pageH - 8, { align: 'center' });

      doc.save('ZamZam-Daily-Report-' + date + '.pdf');
    }

    async function loadCustomerBills() {
      const monthVal = document.getElementById('billMonth').value;
      if (!monthVal) { alert('Please select a month.'); return; }

      const [year, month] = monthVal.split('-').map(Number);
      const container = document.getElementById('customerBillsList');
      container.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding:15px;">Loading...</p>';

      const { data: customers } = await supabaseClient
        .from('customers')
        .select('*')
        .eq('is_active', true)
        .order('name');

      if (!customers || customers.length === 0) {
        container.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding:15px;">No customers found.</p>';
        return;
      }

      let html = '';
      for (const c of customers) {
        const { data: account } = await supabaseClient
          .from('customer_monthly_accounts')
          .select('*')
          .eq('customer_id', c.id)
          .eq('month', month)
          .eq('year', year)
          .single();

        const delivered = account?.total_delivered || 0;
        const paid = account?.total_paid || 0;
        const balance = delivered - paid;

        html += `
          <div class="customer-bill-item">
            <div>
              <div class="cname">👤 ${c.name}</div>
              <div style="font-size:12px; color:#777; margin-top:3px;">
                Delivered: Rs ${delivered.toLocaleString()} | Paid: Rs ${paid.toLocaleString()}
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
              <span class="cbalance">Rs ${balance.toLocaleString()}</span>
              <button class="btn-bill" onclick="generateCustomerBill('${c.id}', '${c.name}', '${c.address || ''}', ${c.milk_rate}, ${c.yogurt_rate}, ${month}, ${year})">🧾 PDF</button>
            </div>
          </div>`;
      }

      html += `<button class="btn-all-bills" onclick="generateAllBills(${month}, ${year})">📄 Download All Bills</button>`;
      container.innerHTML = html;
    }

    async function generateCustomerBill(customerId, name, address, milkRate, yogurtRate, month, year) {
      const { data: deliveries } = await supabaseClient
        .from('deliveries')
        .select('*')
        .eq('customer_id', customerId)
        .eq('month', month)
        .eq('year', year);

      const { data: account } = await supabaseClient
        .from('customer_monthly_accounts')
        .select('*')
        .eq('customer_id', customerId)
        .eq('month', month)
        .eq('year', year)
        .single();

      const { data: prevAccounts } = await supabaseClient
        .from('customer_monthly_accounts')
        .select('*')
        .eq('customer_id', customerId)
        .neq('month', month)
        .order('year', { ascending: false })
        .order('month', { ascending: false })
        .limit(3);

      const totalMilk = deliveries?.reduce((s, r) => s + (r.milk_kg || 0), 0) || 0;
      const totalYogurt = deliveries?.reduce((s, r) => s + (r.yogurt_kg || 0), 0) || 0;
      const milkAmount = totalMilk * milkRate;
      const yogurtAmount = totalYogurt * yogurtRate;
      const totalDelivered = account?.total_delivered || 0;
      const totalPaid = account?.total_paid || 0;
      const balance = totalDelivered - totalPaid;

      const doc = new jsPDF();
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();

      doc.setFillColor(26, 92, 42);
      doc.rect(0, 0, pageW, 45, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.text('ZamZam Fresh Dairy Products', pageW / 2, 15, { align: 'center' });
      doc.setFontSize(13);
      doc.setFont('helvetica', 'normal');
      doc.text('&', pageW / 2, 23, { align: 'center' });
      doc.setFontSize(14);
      doc.text('subzi.pk', pageW / 2, 31, { align: 'center' });
      doc.setFontSize(10);
      doc.text('Customer Bill — ' + monthNames[month - 1] + ' ' + year, pageW / 2, 40, { align: 'center' });

      doc.setTextColor(0, 0, 0);
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text('Customer Details', 14, 58);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text('Name:    ' + name, 14, 67);
      doc.text('Address: ' + (address || 'N/A'), 14, 75);

      doc.setDrawColor(26, 92, 42);
      doc.setLineWidth(0.5);
      doc.line(14, 80, pageW - 14, 80);

      let y = 92;

      doc.setFillColor(232, 245, 233);
      doc.rect(14, y - 6, pageW - 28, 9, 'F');
      doc.setTextColor(26, 92, 42);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.text('Product', 18, y);
      doc.text('Qty (kg)', 80, y);
      doc.text('Rate (Rs)', 120, y);
      doc.text('Amount (Rs)', pageW - 14, y, { align: 'right' });
      y += 12;

      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'normal');

      if (totalMilk > 0) {
        doc.text('Milk', 18, y);
        doc.text(totalMilk.toFixed(2), 80, y);
        doc.text(milkRate.toLocaleString(), 120, y);
        doc.text('Rs ' + milkAmount.toLocaleString(), pageW - 14, y, { align: 'right' });
        doc.setDrawColor(220, 220, 220);
        doc.line(14, y + 3, pageW - 14, y + 3);
        y += 13;
      }

      if (totalYogurt > 0) {
        doc.text('Yogurt', 18, y);
        doc.text(totalYogurt.toFixed(2), 80, y);
        doc.text(yogurtRate.toLocaleString(), 120, y);
        doc.text('Rs ' + yogurtAmount.toLocaleString(), pageW - 14, y, { align: 'right' });
        doc.setDrawColor(220, 220, 220);
        doc.line(14, y + 3, pageW - 14, y + 3);
        y += 13;
      }

      y += 3;

      const totalRow = (label, value, highlight = false) => {
        if (highlight) {
          doc.setFillColor(232, 245, 233);
          doc.rect(14, y - 5, pageW - 28, 9, 'F');
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(26, 92, 42);
        } else {
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(0, 0, 0);
        }
        doc.setFontSize(10);
        doc.text(label, 18, y);
        doc.text(value, pageW - 14, y, { align: 'right' });
        y += 12;
      };

      totalRow('Total Amount', 'Rs ' + totalDelivered.toLocaleString());
      totalRow('Amount Paid', 'Rs ' + totalPaid.toLocaleString());
      totalRow('Balance Due', 'Rs ' + balance.toLocaleString(), true);
      y += 5;

      if (prevAccounts && prevAccounts.length > 0) {
        const prevDue = prevAccounts.filter(p => (p.total_delivered - p.total_paid) > 0);
        if (prevDue.length > 0) {
          doc.setFillColor(255, 248, 225);
          doc.rect(14, y - 5, pageW - 28, 8, 'F');
          doc.setTextColor(121, 85, 72);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10);
          doc.text('Previous Month Balances', 18, y);
          y += 12;
          prevDue.forEach(p => {
            const pb = p.total_delivered - p.total_paid;
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(0, 0, 0);
            doc.text(monthNames[p.month - 1] + ' ' + p.year, 18, y);
            doc.setTextColor(192, 57, 43);
            doc.text('Rs ' + pb.toLocaleString(), pageW - 14, y, { align: 'right' });
            y += 10;
          });
        }
      }

      y += 10;
      doc.setTextColor(26, 92, 42);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(11);
      doc.text('Thank you for your business!', pageW / 2, y, { align: 'center' });

      doc.setFillColor(26, 92, 42);
      doc.rect(0, pageH - 20, pageW, 20, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('0300-4455771  |  admin@subzi.pk  |  subzi.pk', pageW / 2, pageH - 8, { align: 'center' });

      doc.save('ZamZam-Bill-' + name + '-' + monthNames[month - 1] + '-' + year + '.pdf');
    }

    async function generateAllBills(month, year) {
      const { data: customers } = await supabaseClient
        .from('customers')
        .select('*')
        .eq('is_active', true)
        .order('name');

      if (!customers || customers.length === 0) return;

      for (const c of customers) {
        await generateCustomerBill(c.id, c.name, c.address || '', c.milk_rate, c.yogurt_rate, month, year);
        await new Promise(r => setTimeout(r, 500));
      }
    }
  </script>

</body>
</html>
